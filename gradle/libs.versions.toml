# Version catalog for the contract modules.
#
# Pruned to what this repository actually builds. It arrived from
# compose-ai-tools whole — 174 entries — but the nine modules here reference only
# these. Renovate reads the catalog rather than the build files, so every unused
# entry was a dependency it would offer to bump, on a build that could not fail
# on the result: eight such PRs were opened and closed before this prune, most of
# them past a compatibility floor compose-ai-tools deliberately holds.
#
# Adding an entry here means committing to keeping it in step with upstream until
# cutover. If a module that needs Android, Compose or Robolectric dependencies
# moves into this repository, port the matching ceiling rules from
# compose-ai-tools' .github/renovate.json in the same change — they are the only
# thing standing between a green build and a silently raised published floor.

[versions]
# Held at 2.4.0: CodeQL's Kotlin extractor doesn't support 2.4.10 yet — it aborts with
# `Kotlin version too new`, which fails the `Analyze (java-kotlin)` job as a configuration error
# and leaves the repo's main language unscanned. Bump once the CodeQL bundle catches up (the
# alternative, disabling Kotlin extraction, would trade away the scan itself).
kotlin = "2.4.10"
# Kotlin language/api floor for published modules. Set lower than `kotlin`
# so consumers on an older Kotlin can still link against our artifacts —
# tapmoc enforces this and fails the build if a transitive API dep raises
# the floor. Bump only when the published surface needs a newer feature.
# 2.0.21 captures consumers on Kotlin 2.0.x (e.g. apps still on Gradle 8.x,
# whose embedded Kotlin runtime tops out around 2.0.21); we use no 2.1+
# language features in any published module so dropping to 2.0.21 has zero
# cost on our source today.
# Caveat: the 2.3.x compiler emits `Language version 2.0 is deprecated and
# its support will be removed in a future version of Kotlin`. That warning
# is silenced via `-Xsuppress-version-warnings` in the modules calling
# `configureKotlinCompatibility(...)`; remove the flag (and bump this to
# `2.1.x`) when the removal lands and we're ready to drop 2.0.x consumers.
kotlinCoreLibraries = "2.0.21"
agp = "9.4.0"
ktfmt = "0.27.0"
tapmoc = "0.4.2"
kotlinx-serialization = "1.11.0"
okio = "3.18.1"
junit = "4.13.2"
maven-publish = "0.37.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }
