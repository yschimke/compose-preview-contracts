# Publishes the wire contracts to Maven Central for a tag.
#
# This repository owns `ee.schimke.composeai:daemon-protocol` and its siblings since the cutover
# (docs/VERSIONING.md). compose-ai-tools consumes them; nothing else publishes them.
#
# A published coordinate is PERMANENT. Central does not accept a second upload of the same GAV, and
# `publishToMavenCentral(automaticRelease = true)` promotes without a human looking — so every
# check that can run before the upload runs before it, and the release stays a draft until the
# upload succeeds.
name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: The `vX.Y.Z` tag to publish.
        required: true
        type: string
    secrets:
      # Declared optional so a missing one reaches the preflight step below, which names it and
      # says what it is. `required: true` fails the whole call with an opaque error instead.
      SIGNING_KEY: {required: false}
      SIGNING_KEY_ID: {required: false}
      SIGNING_KEY_PASSWORD: {required: false}
      MAVEN_CENTRAL_USERNAME: {required: false}
      MAVEN_CENTRAL_PASSWORD: {required: false}
  # Re-publish a tag whose first attempt failed before the upload — a missing secret, say. NOT a
  # way to replace a published version: Central rejects that, and this workflow does not force it.
  workflow_dispatch:
    inputs:
      tag_name:
        description: The `vX.Y.Z` tag to publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ inputs.tag_name }}

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write # un-draft the release once the upload succeeds
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check publishing credentials are configured
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "${2:-}" ]; then
              echo "::error::$1 is not set. $3"
              missing=1
            fi
          }
          check SIGNING_KEY "${SIGNING_KEY:-}" \
            "The armoured GPG private key. ComposeAiMavenPublishingPlugin signs every non-snapshot publication and Central rejects unsigned artifacts."
          check SIGNING_KEY_ID "${SIGNING_KEY_ID:-}" "The GPG key id for that key."
          check SIGNING_KEY_PASSWORD "${SIGNING_KEY_PASSWORD:-}" "The passphrase for that key."
          check MAVEN_CENTRAL_USERNAME "${MAVEN_CENTRAL_USERNAME:-}" "The Central Portal token username."
          check MAVEN_CENTRAL_PASSWORD "${MAVEN_CENTRAL_PASSWORD:-}" "The Central Portal token password."
          [ "$missing" -eq 0 ] || exit 1
          echo "all five credentials present"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
          # Full history, because the publish plan below compares each module against the tag IT
          # last published at. With the default shallow clone those tags are absent, the plan takes
          # its fail-safe path and marks every module dirty — a release that publishes everything
          # while reporting success, which is the saving silently turning itself off.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17.0.20+8
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The tag decides what gets published, and a published GAV cannot be taken back. Prove it
      # agrees with the manifest release-please wrote before anything is uploaded.
      - name: Check the tag matches the manifest
        run: |
          set -euo pipefail
          want="${TAG_NAME#v}"
          have="$(python3 -c 'import json;print(json.load(open(".release-please-manifest.json"))["."])')"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $TAG_NAME implies $want but .release-please-manifest.json says $have. Cut the tag from a release-please commit."
            exit 1
          fi
          echo "publishing $have"

      # Which modules this release actually uploads. `maven-publish-plan.sh` compares each module
      # against the tag it last published at, propagates to dependents, and resolves every
      # uncertainty to "publish": Central refuses a second upload of a version, so an unnecessary
      # publish costs quota while a wrongly-skipped one is unrepairable.
      #
      # A `workflow_dispatch` recovery run gets no plan. Its baseline may not be trustworthy — that
      # is usually why someone is re-running it — and publishing everything is the safe answer.
      #
      # An EMPTY publish set is a real answer, not a missing one: a releasable change confined to
       # `.github/` or the docs publishes no Maven module. `-Pcomposeai.publishSet=` (empty)
      # says that, while omitting the property says "no plan ran, publish everything".
      - name: Compute the publish plan
        run: |
          set -euo pipefail
          PUBLISH_SET=""
          PUBLISH_PLANNED=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # `--write-manifest` puts the baseline the plan resolved from Central into the
            # workspace, where the Gradle build reads it to give a skipped module the version it
            # is already published at. Written, never committed.
            PUBLISH_SET="$(.github/scripts/maven-publish-plan.sh --head "$TAG_NAME" \
              --write-manifest publishing-manifest.json | paste -sd, -)"
            PUBLISH_PLANNED=true
          fi
          echo "plan ran: $PUBLISH_PLANNED; publish set: ${PUBLISH_SET:-<empty>}"
          # `PUBLISH_PLANNED` is what keeps the two empty strings apart downstream. An empty set
          # from a plan means "publish nothing"; no plan at all means "publish everything",
          # and passing `-Pcomposeai.publishSet=` on a recovery run would silently turn the
          # second into the first.
          echo "PUBLISH_SET=$PUBLISH_SET" >> "$GITHUB_ENV"
          echo "PUBLISH_PLANNED=$PUBLISH_PLANNED" >> "$GITHUB_ENV"

      # Everything the artifacts have to survive, before they are permanent: compile, test, ktfmt
      # and checkKotlinAbi for all twelve modules.
      - name: Check
        env:
          PLUGIN_VERSION: ${{ inputs.tag_name }}
        run: ./gradlew --no-daemon check

      # A dry run against the local repository. The POMs either resolve every internal coordinate
      # or they do not, and finding that out here costs nothing while finding it out on Central
      # costs a version number.
      - name: Publish to Maven Local first
        env:
          PLUGIN_VERSION: ${{ inputs.tag_name }}
          # The signing keys are needed HERE, not just for the Central upload:
          # ComposeAiMavenPublishingPlugin signs every non-snapshot publication, so
          # `publishToMavenLocal` at a release version runs `signMavenPublication` and fails with
          # "No configured signatory" without them. Central's own credentials are not needed for a
          # local publish and are deliberately not passed.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          V="${TAG_NAME#v}"
          PLAN_ARGS=()
          if [ "$PUBLISH_PLANNED" = "true" ]; then
            PLAN_ARGS+=("-Pcomposeai.publishSet=$PUBLISH_SET")
          fi
          PLUGIN_VERSION="$V" ./gradlew --no-daemon publishToMavenLocal "${PLAN_ARGS[@]}"
          # Each module is checked at the version it will actually carry, which is the tag only
          # for the modules this release publishes; a skipped one keeps its recorded version.
          # `expected-poms.py` says which is which, and the empty publish set is passed through as
          # an empty `--publish-set` rather than omitted — omitting it means "no plan ran".
          if [ "$PUBLISH_PLANNED" = "true" ]; then
            .github/scripts/expected-poms.py --version "$V" --publish-set "$PUBLISH_SET" \
              > /tmp/expected-poms
          else
            .github/scripts/expected-poms.py --version "$V" > /tmp/expected-poms
          fi
          count=0
          while read -r m v; do
            pom="$HOME/.m2/repository/ee/schimke/composeai/$m/$v/$m-$v.pom"
            [ -f "$pom" ] || { echo "::error::$m did not produce a POM at $v"; exit 1; }
            count=$((count + 1))
          done < /tmp/expected-poms
          echo "$count coordinates produced artifacts"

      - name: Publish to Maven Central
        env:
          PLUGIN_VERSION: ${{ inputs.tag_name }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          # Ask Gradle for the task paths rather than deriving them here: the plan enumerates
          # modules by artifact id and Gradle addresses them by project path. A hand-kept mapping
          # between the two is exactly the artefact that goes stale silently, and stale here means
          # publishing a module twice or dropping one out of a release.
          PLAN_ARGS=()
          if [ "$PUBLISH_PLANNED" = "true" ]; then
            PLAN_ARGS+=("-Pcomposeai.publishSet=$PUBLISH_SET")
          fi
          TASKS="$(./gradlew -q printPublishTasks "${PLAN_ARGS[@]}" | cut -f1 | tr '\n' ' ')"
          echo "publishing: $TASKS"
          # A planned empty list means no artifact changed. It is successful; retain the failure
          # for an unplanned/recovery release, where a bare `./gradlew` would only run `help`.
          [ -n "$TASKS" ] || { [ "$PUBLISH_PLANNED" = "true" ] && exit 0; echo "::error::no publish tasks resolved"; exit 1; }
          # shellcheck disable=SC2086
          PLUGIN_VERSION="${TAG_NAME#v}" ./gradlew --no-daemon $TASKS "${PLAN_ARGS[@]}"

      # Only now is the release real. Until the upload succeeds it stays a draft, so a failed
      # publish does not leave a release announcing artifacts that are not there.
      - name: Publish the release (un-draft + mark latest)
        run: |
          set -euo pipefail
          gh release edit "$TAG_NAME" --draft=false --latest
          echo "published $TAG_NAME"
