# Keeps a "chore(main): release X.Y.Z" pull request up to date, and turns merging it into a
# Maven Central publish.
#
# Two release-please invocations, deliberately — see AGENTS.md. A single one computes the next
# candidate PR in the same run that cuts the release, and because our releases are drafts (and a
# draft creates no tag) that half reads the PREVIOUS release as its baseline and re-proposes the
# version being released. That produced a phantom PR in compose-preview-vscode#5; the same shape
# would happen here.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Quoted: the `chore(main): release ` literal contains `: `, which YAML would otherwise read as
  # a nested mapping. A merged release PR gets its own slot so an ordinary push cannot replace it
  # while the publish is still pending.
  group: "release-please-${{ github.ref }}-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ') && github.sha || 'updates' }}"
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub Releases
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # A draft release does not create its tag — GitHub writes the ref only on publish — and
      # `release.yml` checks out `ref: <tag>`. Idempotent, and `!cancelled()` so a late failure in
      # the action cannot leave the manifest naming a version with no tag.
      - name: Ensure the release tag exists for the draft
        if: ${{ !cancelled() && steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/{owner}/{repo}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
            exit 0
          fi
          gh api --method POST "repos/{owner}/{repo}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${SHA}" >/dev/null
          echo "created tag ${TAG} at ${SHA}"

  release:
    name: Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      # No `pull-requests: write`: `record-published` was the only job that needed it and it is
      # gone — the publish plan reads its baseline from Maven Central and writes nothing back.
      # Keep that true. A called workflow cannot elevate what its caller granted, and asking for
      # more is not a job failure but a startup failure of the whole run — no jobs, no release,
      # and nothing in the log to say why (compose-preview-daemon#131).
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # The PR half, split out so it never runs against a half-published release. Runs on an ordinary
  # push (the normal case) or straight after a SUCCESSFUL release, to open the next one against a
  # baseline that includes the tag just published. Deliberately not after a failed release: the
  # baseline is stale in exactly the way that produces a phantom PR.
  update-release-pr:
    name: Update the release PR
    needs: [release-please, release]
    if: >-
      ${{ !cancelled()
      && (needs.release-please.outputs.release_created != 'true'
      || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
      in_flight: ${{ steps.preflight.outputs.in_flight }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An ordinary push and a release-PR merge hold separate concurrency slots, so on an
      # ordinary push this pass can run while another run's release is still a draft.
      # release-please cannot see drafts: it would baseline on the release before and rewrite
      # the release PR with history that is already released, until the next push (#43, #96).
      # The guard skips the pass while a release is in flight (the release run's own pass, after
      # `release`, writes the PR), and closes a duplicate a mid-run merge still produced. See
      # `.github/scripts/release-pr-race-guard.sh`.
      - name: Check whether a release is in flight
        id: preflight
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        env:
          MODE: check
        run: ./.github/scripts/release-pr-race-guard.sh

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        if: ${{ steps.preflight.outputs.in_flight != 'true' }}
        # The failure this tolerates is the race's own: updating a release PR that merged out
        # from under it. The last step re-raises anything else.
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Discard a release PR the race produced
        id: repair
        if: ${{ always() && needs.release-please.outputs.release_created != 'true' && steps.preflight.outputs.in_flight != 'true' }}
        env:
          MODE: repair
          RP_PR: ${{ steps.rp.outputs.pr }}
        run: ./.github/scripts/release-pr-race-guard.sh

      - name: Re-raise a release-please failure the race does not explain
        if: ${{ always() && steps.rp.outcome == 'failure' && steps.repair.outputs.raced != 'true' }}
        run: |
          echo "::error::release-please failed and no release was in flight — see the step above."
          exit 1

  # Which Maven coordinates merging the release PR would publish, as one comment on that PR. The
  # publish plan only runs inside the release, so the answer was visible only after the
  # irreversible upload. Same script, same Maven Central baseline, run against the release PR's
  # head; see `.github/scripts/release-pr-publish-plan.sh` (shared with compose-preview-daemon, compose-ai-tools, rc-players and compose-ui-builder). It follows
  # `update-release-pr` and annotates the PR that pass just wrote; it skips while another run's
  # release is in flight, because that PR is about to be rewritten. Informational: it never fails.
  release-pr-publish-plan:
    needs: update-release-pr
    if: ${{ !cancelled() && needs.update-release-pr.result == 'success' && needs.update-release-pr.outputs.in_flight != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # create/edit the comment on the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comment the publish plan on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RP_PR: ${{ needs.update-release-pr.outputs.pr }}
        run: ./.github/scripts/release-pr-publish-plan.sh
