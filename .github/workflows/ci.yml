name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: compose-preview-contracts

      # `DeviceDimensionsCatalogDriftTest` compares `DeviceDimensions` against the copy in the
      # upstream Gradle plugin. That copy is in another repository now, and the test SKIPS when it
      # cannot find a checkout — which would make the check silently vacuous on CI, the one place
      # it has to be real. So CI checks upstream out and points the test at it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          persist-credentials: false
          path: compose-ai-tools
          # Only the plugin's DeviceDimensions.kt is read; no need for the full history.
          fetch-depth: 1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check
        working-directory: compose-preview-contracts
        env:
          COMPOSE_AI_TOOLS_ROOT: ${{ github.workspace }}/compose-ai-tools
        run: ./gradlew --no-daemon check

      # A pull request may not remove a signature the last release exposed, synthetic ones included:
      # `checkKotlinAbi` only compares the code with the dump committed beside it, so it cannot see
      # this. Contracts 3.13.0 shipped exactly that break (#122) and the server took a
      # `NoSuchMethodError`. A deliberate break is a major: title the PR `feat!:`. The release PR
      # moves the manifest to a tag that does not exist yet, and only bumps versions, so it is skipped.
      - name: ABI is a superset of the last release
        if: github.event_name == 'pull_request'
        working-directory: compose-preview-contracts
        env:
          ABI_BREAK_OK: ${{ contains(github.event.pull_request.title, '!:') && '1' || '0' }}
        run: |
          tag="v$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')"
          if ! git fetch --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"; then
            echo "no ${tag} tag yet: a release PR, which only bumps versions"
            exit 0
          fi
          python3 .github/scripts/check-abi-superset.py

      # The release scripts decide what reaches Maven Central, where nothing can be taken back, and
      # most of their branches never run on an ordinary release: the empty plan had not run once
      # in seven releases. Tested here, on every PR, against throwaway git repositories and a fake
      # Gradle launcher.
      - name: Release script tests
        working-directory: compose-preview-contracts
        run: python3 -m unittest discover -s .github/scripts/tests -v

      # The Gradle half of the same contract: what `printPublishTasks` returns for an absent, an
      # empty and a one-module publish set. An empty set must list nothing — not even `:bom`.
      - name: printPublishTasks honours the publish set
        working-directory: compose-preview-contracts
        run: .github/scripts/tests/print-publish-tasks-test.sh

      - name: Assert the cross-repo drift check actually ran
        working-directory: compose-preview-contracts
        # A skipped drift test reports the same green as a passing one. Fail loudly if the
        # upstream checkout did not take, rather than shipping a check that verifies nothing.
        run: |
          set -euo pipefail
          report=$(find daemon/devices/build/test-results/test -name '*CatalogDrift*.xml' | head -1)
          if [ -z "$report" ]; then
            echo "::error::no DeviceDimensionsCatalogDriftTest results found"; exit 1
          fi
          if grep -q "<skipped" "$report"; then
            echo "::error::the cross-repo drift check SKIPPED on CI — COMPOSE_AI_TOOLS_ROOT did not resolve"
            grep -o 'message="[^"]*"' "$report" | head -3
            exit 1
          fi
          echo "cross-repo drift check ran for real"

      - name: Publish to mavenLocal
        working-directory: compose-preview-contracts
        # Cheap proof that every module still produces a resolvable POM — the failure mode a
        # contracts repo cannot afford is publishing coordinates a consumer cannot resolve.
        run: ./gradlew --no-daemon publishToMavenLocal
